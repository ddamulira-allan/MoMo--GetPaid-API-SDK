name: Build & Publish

on:
  # Publish automatically when a version tag is pushed (e.g. v1.0.0)
  push:
    tags:
      - 'v*.*.*'

  # Also allow a manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (pack only, do not publish)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # Required for npm provenance attestation
  id-token: write

jobs:
  # ── Job 1: Build & type-check ───────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build (ESM + CJS)
        run: npm run build

      - name: Verify dist output
        run: |
          echo "── ESM output ──"
          ls dist/esm/
          echo "── CJS output ──"
          ls dist/cjs/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── Job 2: Publish to npm ───────────────────────────────────────────────────
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (with npm registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Pack (dry run — inspect what will be published)
        run: npm pack --dry-run

      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
