name: MoMo Get Paid
values:
  - key: baseUrl
    value: 'https://sandbox.momodeveloper.mtn.com'
    description: MoMo API base URL
    enabled: true
    type: default
  - key: apiUser
    value: ''
    description: API user UUID (from MoMo developer portal)
    enabled: true
    type: default
  - key: apiKey
    value: ''
    description: API key secret (from MoMo developer portal)
    enabled: true
    type: default
  - key: subscriptionKey
    value: ''
    description: Ocp-Apim-Subscription-Key for Collection product
    enabled: true
    type: default
  - key: disbursementSubscriptionKey
    value: ''
    description: Ocp-Apim-Subscription-Key for Disbursement product
    enabled: true
    type: default
  - key: targetEnvironment
    value: sandbox
    description: sandbox or production
    enabled: true
    type: default
  - key: msisdn
    value: '256771234567'
    description: Mobile number to use in account/payment requests
    enabled: true
    type: default
  - key: accessToken
    value: ''
    description: Bearer token (auto-set by Generate Access Token script)
    enabled: true
    type: default
  - key: requestId
    value: ''
    description: UUID for Request to Pay (auto-generated by pre-request script)
    enabled: true
    type: default
  - key: requestIdRefund
    value: ''
    description: UUID for Refund (auto-generated by pre-request script)
    enabled: true
    type: default
  - key: callbackUrl
    value: ''
    description: Optional webhook URL for async notifications
    enabled: true
    type: default
