$kind: http-request
order: 2000
method: GET
url: '{{baseUrl}}/disbursement/v1_0/refund/{{requestIdRefund}}'
description: |-
  Get the status of a previously initiated refund.

  Use the `requestIdRefund` (UUID) returned by the **Refund** call.

  Possible status values: `PENDING`, `SUCCESSFUL`, `FAILED`.
headers:
  - key: Authorization
    value: 'Bearer {{accessToken}}'
  - key: X-Target-Environment
    value: '{{targetEnvironment}}'
  - key: Ocp-Apim-Subscription-Key
    value: '{{disbursementSubscriptionKey}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Status code ──────────────────────────────────────────────────────────
      pm.test('Status is 200 OK', () => {
          pm.response.to.have.status(200);
      });

      // ── Response time ─────────────────────────────────────────────────────────
      pm.test('Response time is under 5000ms', () => {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });

      // ── Schema validation ─────────────────────────────────────────────────────
      pm.test('Response has required refund status fields', () => {
          const json = pm.response.json();
          pm.expect(json).to.be.an('object');
          pm.expect(json).to.have.property('status').that.is.a('string');
          pm.expect(json).to.have.property('amount').that.is.a('string');
          pm.expect(json).to.have.property('currency').that.is.a('string');
          pm.expect(json).to.have.property('externalId').that.is.a('string');
      });

      // ── Business logic ────────────────────────────────────────────────────────
      pm.test('Refund status is a valid value', () => {
          const json = pm.response.json();
          pm.expect(['PENDING', 'SUCCESSFUL', 'FAILED']).to.include(json.status);
      });

      pm.test('Refund amount matches requested amount', () => {
          const json = pm.response.json();
          pm.expect(json.amount).to.equal('100');
      });

      pm.test('Refund currency matches requested currency', () => {
          const json = pm.response.json();
          pm.expect(json.currency).to.equal('EUR');
      });

      // ── Variable chaining ─────────────────────────────────────────────────────
      pm.test('Refund financialTransactionId saved when successful', () => {
          const json = pm.response.json();
          if (json.status === 'SUCCESSFUL' && json.financialTransactionId) {
              pm.collectionVariables.set('refundFinancialTransactionId', json.financialTransactionId);
              console.log('✅ refundFinancialTransactionId saved:', json.financialTransactionId);
          } else {
              console.log('ℹ️ Refund status:', json.status, '— financialTransactionId not yet available');
          }
      });
